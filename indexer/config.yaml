# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Likeness on Arbitrum Sepolia: all four protocol contracts from the deployment block.
#
# Data source: HyperSync (https://421614.hypersync.xyz) when ENVIO_API_TOKEN is set, with the RPC as a
# fallback; without a token, the RPC is the sync source (ENVIO_RPC_FOR=sync, the default here).
# `pnpm local` picks this for you.
name: likeness-indexer
contracts:
  - name: CreatorRegistry
    abi_file_path: ./abis/CreatorRegistry.json
    events:
      - event: CreatorRegistered
      - event: AttestationUpdated
      - event: TermsSet
      - event: PayoutSet
      - event: ActiveSet
      - event: AllRevoked
      - event: Suspended
  - name: LicenseRegistry
    abi_file_path: ./abis/LicenseRegistry.json
    events:
      - event: LicenceIssued
      - event: LicenceRevoked
      - event: RenderRecorded
  - name: LicenseEscrow
    abi_file_path: ./abis/LicenseEscrow.json
    events:
      - event: Deposited
      - event: RenderPaid
      - event: Refunded
      - event: RenderAgentSet
  - name: ReceiptAnchor
    abi_file_path: ./abis/ReceiptAnchor.json
    events:
      - event: ReceiptAnchored
field_selection:
  transaction_fields: [hash]
chains:
  - id: 421614
    start_block: ${ENVIO_START_BLOCK:-0}
    rpc:
      - url: ${ENVIO_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
        for: ${ENVIO_RPC_FOR:-sync}
        initial_block_interval: 5000
        interval_ceiling: 10000
    contracts:
      - name: CreatorRegistry
        address: "0x0000000000000000000000000000000000000000"
      - name: LicenseRegistry
        address: "0x0000000000000000000000000000000000000000"
      - name: LicenseEscrow
        address: "0x0000000000000000000000000000000000000000"
      - name: ReceiptAnchor
        address: "0x0000000000000000000000000000000000000000"

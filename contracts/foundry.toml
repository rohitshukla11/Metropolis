[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 10_000
use_literal_content = true
fs_permissions = [{ access = "write", path = "../deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
# Public endpoint: https://docs.arbitrum.io/for-devs/dev-tools-and-resources/chain-info
arbitrum_sepolia = "${RPC_URL}"

[etherscan]
# Arbiscan verification through the Etherscan V2 API (one key for every Etherscan-family explorer).
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }

[lint]
lint_on_build = false
